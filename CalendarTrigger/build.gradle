apply plugin: 'com.android.application'

// If you've cloned this project and want to build it
// you need to create a signing key in ../Keys/keystore.properties
// or change this code to point to a signing key
// that you already have
def keystorePropertiesFile = rootProject.file("../Keys/keystore.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

// This bit of fantasy extracts some git information
// which will get put into resources which are displayed
// on the debugging page
def gitdata1 = new ByteArrayOutputStream()
def gitdata2 = new ByteArrayOutputStream()
def gitdata3 = new ByteArrayOutputStream()
// change this line to /* if not using git
exec {
    commandLine "git", "--no-pager", "show", "-s",
            "--format=from commit %H"
    standardOutput = gitdata1
}
exec {
    commandLine "git", "--no-pager", "show", "-s",
            "--date=format:%H:%M:%S GMT%z %a %b %d %Y",
            "--format=of %ad"
    standardOutput = gitdata2
}
exec {
    commandLine "git", "branch", "--show-current"
    standardOutput = gitdata3
}
//*/

// This bit of fantasy puts the compile, minimum and target
// version API numbers, and the version name, into resources
// so that the debugging page can display these too.
def compileVersion = 23
def minVersion = 21
def targetVersion = 22
def CTversion = "3.4"
def appID = "uk.co.yahoo.p1rpp.calendartrigger"

android {
    signingConfigs {
        config {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }
    compileSdk compileVersion
    project.archivesBaseName = "CalendarTrigger"
    defaultConfig {
        applicationId appID
        //noinspection ExpiredTargetSdkVersion
        minSdk minVersion
        targetSdk targetVersion
        versionCode 9
        versionName CTversion
    }
    buildTypes {
        release {
            minifyEnabled true

            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.pro'
            signingConfig signingConfigs.config
            delete("build/intermediates/incremental/mergeReleaseResources/merger.xml")
            resValue("string", 'build_time',
                    "${(new Date()).format('HH:mm:ss \'GMT\'Z EEE dd MMM yyyy')}")
            resValue("string", 'build_git1', "${gitdata1.toString()}")
            resValue("string", 'build_git2', "${gitdata2.toString()}")
            resValue("string", 'build_git3',
                    "${" on branch " + gitdata3.toString()}")
            resValue("string", 'compileVersion', "${compileVersion.toString()}")
            resValue("string", 'minVersion', "${minVersion.toString()}")
            resValue("string", 'targetVersion', "${targetVersion.toString()}")
            resValue("string", 'myVersion', "${CTversion.toString()}")
        }
        debug {
            signingConfig signingConfigs.config
            delete("build/intermediates/incremental/mergeDebugResources/merged.dir/values/values.xml")
            resValue("string", 'build_time',
                    "${(new Date()).format('HH:mm:ss \'GMT\'Z EEE dd MMM yyyy')}")
            resValue("string", 'build_git1', "${gitdata1.toString()}")
            resValue("string", 'build_git2', "${gitdata2.toString()}")
            resValue("string", 'build_git3',
                    "${" on branch " + gitdata3.toString()}")
            resValue("string", 'compileVersion', "${compileVersion.toString()}")
            resValue("string", 'minVersion', "${minVersion.toString()}")
            resValue("string", 'targetVersion', "${targetVersion.toString()}")
            resValue("string", 'myVersion', "${CTversion.toString()}")
        }
    }
    sourceSets {
        main {
            java.srcDirs =
                    ['src/main/java']
        }
    }
    lintOptions {
        disable("ExpiredTargetSdkVersion")
    }
    namespace 'uk.co.yahoo.p1rpp.calendartrigger'
}


dependencies {
    api fileTree(include: ['*.jar'], dir: 'libs')
    api 'com.android.support:support-v4:23.2.1'
}
